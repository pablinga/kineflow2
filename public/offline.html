<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F55DC" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · KineFlow</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #eef4ff;
        color: #0d1b2a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 32px 24px;
        border: 1px solid #dce8ff;
        border-radius: 16px;
        background: #ffffff;
        text-align: center;
        box-shadow: 0 10px 30px rgba(13, 27, 42, 0.06);
      }
      img { width: 56px; height: 56px; }
      h1 { margin: 16px 0 8px; font-size: 20px; }
      p { margin: 0; color: #475569; font-size: 15px; line-height: 1.5; }
      button {
        margin-top: 24px;
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        background: #0f55dc;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #0d1b2a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <!-- Pantalla que muestra el service worker (public/sw.js) cuando una
         navegación falla por falta de conexión. Es estática: no tiene ni
         guarda datos de pacientes. -->
    <main>
      <img alt="" src="/kineflow-icon.svg" />
      <h1>Sin conexión</h1>
      <p>KineFlow necesita internet para mostrar tu agenda y tus pacientes. Revisá la conexión y volvé a intentar.</p>
      <button onclick="location.reload()" type="button">Reintentar</button>
    </main>
  </body>
</html>
